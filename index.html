<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Autohaus Muster Showroom</title>
<meta name="description" content="Alle Fahrzeuge unseres Autohauses auf einen Blick: wischen, vergleichen, anfragen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@600;700&display=swap">
<style>
/* Layout: phone-first lot window. Reel of cars first, live details of the centred car below. Light single look, like a clean price sign. */
:root{
  color-scheme:light;
  --bg:#f2f4f7; --panel:#ffffff; --panel-2:#e9edf2; --line:#d9dfe7;
  --fg:#132030; --muted:#5d6b7b; --accent:#1c58c9; --accent-ink:#ffffff; --deal:#c2391b;
  --f-benzin:#d97b1f; --f-diesel:#4a5b6e; --f-hybrid:#23955f; --f-elektro:#1597a6;
  --font-display:"Archivo Narrow","Arial Narrow",Arial,sans-serif;
  --font-body:"Archivo","Helvetica Neue",Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;padding-block:0 40px;overflow-x:hidden}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:720px;margin:0 auto}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
img{max-width:100%}

header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:14px 6px}
.logo{display:flex;align-items:center;gap:10px}
.mark{width:36px;height:36px;border-radius:8px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:18px}
.logo b{display:block;font-family:var(--font-display);font-weight:700;font-size:20px;line-height:1.05}
.logo small{display:block;font-size:12px;color:var(--muted)}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);text-align:right}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.open{background:var(--f-hybrid)} .dot.closed{background:var(--deal)}

/* reel */
.reel{position:relative;overflow:hidden;padding-block:12px 16px;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.reel.dragging{cursor:grabbing}
.track{display:flex;gap:12px;will-change:transform}
.marker{position:absolute;left:50%;top:0;bottom:0;width:0;z-index:3;pointer-events:none}
.marker::before,.marker::after{content:"";position:absolute;left:-7px;border:7px solid transparent}
.marker::before{top:0;border-top-color:var(--accent)}
.marker::after{bottom:0;border-bottom-color:var(--accent)}
.card{flex:none;width:min(300px,74vw);background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;backface-visibility:hidden;
  transition:transform .25s,opacity .25s,box-shadow .25s;opacity:.5;transform:scale(.9)}
.card.is-center{opacity:1;transform:scale(1);box-shadow:0 10px 28px -14px rgba(19,32,48,.45)}
.card.win{animation:win 1s ease-out}
@keyframes win{0%{box-shadow:0 0 0 0 var(--accent)}100%{box-shadow:0 0 0 22px transparent}}
.pic{position:relative;aspect-ratio:4/3;max-width:100%;background:var(--panel-2);overflow:hidden}
.pic svg{position:absolute;inset:0;margin:auto;width:80%;height:auto}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.badge{position:absolute;left:10px;top:10px;z-index:1;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:4px;background:var(--panel);color:var(--fg)}
.badge.deal{background:var(--deal);color:#fff}
.badge.new{background:var(--accent);color:#fff}
.fuel{height:4px;background:var(--fc)}
.card-body{padding:10px 14px 12px;display:flex;flex-direction:column;gap:2px}
.model{font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.variant{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:6px}
.line .price{font-family:var(--font-display);font-weight:700;font-size:26px}
.line .meta{font-size:13px;color:var(--muted);text-align:right}
.empty{padding:60px 10px;text-align:center;color:var(--muted)}

.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar-r{display:flex;gap:8px;align-items:center}
.ghost{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer}
.ghost .n{color:var(--accent);font-weight:600}
.ghost.icon{padding:7px 9px;display:grid;place-items:center}
.spin{font-weight:600;font-size:14px;background:var(--fg);color:var(--bg);border:0;border-radius:999px;padding:8px 14px;cursor:pointer}
.spin:disabled,.ghost:disabled{opacity:.5;cursor:default}

.filters{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.frow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;font-size:14px;color:var(--muted)}
.frow label{display:flex;align-items:center;gap:8px}
.frow output{color:var(--fg);min-width:70px}
input[type=range]{accent-color:var(--accent)}
.frow input[type=range]{width:130px}
select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 8px}

.detail{margin-top:22px;border-top:1px solid var(--line);padding-top:18px}
.d-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.detail h1{font-family:var(--font-display);font-weight:700;font-size:32px;line-height:1.05;margin:0;text-wrap:balance}
.d-variant{color:var(--muted);font-size:14px}
.d-price{text-align:right}
.d-price b{font-family:var(--font-display);font-size:34px;font-weight:700;line-height:1}
.d-price s{display:block;color:var(--muted);font-size:14px}
.d-price small{display:block;color:var(--muted);font-size:12px}
.big{margin-top:14px;border-radius:10px;overflow:hidden}
.big .pic{aspect-ratio:16/10}
.credit{margin-top:6px;font-size:12px;color:var(--muted)}.credit a{color:var(--muted)}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.gallery button{padding:0;border:2px solid transparent;border-radius:6px;overflow:hidden;cursor:pointer;background:var(--panel-2);aspect-ratio:4/3;position:relative}
.gallery button[aria-current="true"]{border-color:var(--accent)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 4px}
.facts div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.facts span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.facts b{font-weight:600;font-size:15px}
.sec{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px}
ul.cond{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px}
ul.cond li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:6px}
ul.cond li span:first-child{color:var(--muted)}
ul.cond li span:last-child{text-align:right}
.cta{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.btn{border:0;border-radius:10px;padding:13px 14px;font-weight:600;cursor:pointer;font-size:15px;text-align:center}
.btn.main{background:var(--accent);color:var(--accent-ink)}
.btn.alt{background:var(--panel);border:1px solid var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.msg{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:14px;white-space:pre-wrap;user-select:text}
.small{font-size:13px;color:var(--muted)}
.foot{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
@media (max-width:420px){.facts{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="pad">
  <header>
    <div class="logo"><span class="mark" aria-hidden="true">AM</span><div><b>Autohaus Muster</b><small>Gebrauchtwagen im Vogtland</small></div></div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText"></span></div>
  </header>
</div>

<div class="reel" id="reel" tabindex="0" aria-label="Fahrzeuge, wischen oder Pfeiltasten">
  <div class="marker" aria-hidden="true"></div>
  <div class="track" id="track"></div>
  <div class="empty" id="empty" hidden>Kein Fahrzeug passt zu diesen Filtern.</div>
</div>

<div class="pad">
  <div class="bar">
    <button class="ghost" id="filterBtn" type="button" aria-expanded="false" aria-controls="filters">Filter <span class="n" id="filterN"></span></button>
    <span class="small num" id="count"></span>
    <span class="bar-r"><button class="ghost icon" id="soundBtn" type="button" aria-pressed="true" aria-label="Ton aus"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="w" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="x" d="M17 9l5 6M22 9l-5 6"/></svg></button><button class="spin" id="spinBtn" type="button">Überrasch mich</button></span>
  </div>

  <div class="filters" id="filters" hidden>
    <div class="chips" id="fuelChips" role="group" aria-label="Kraftstoff"></div>
    <div class="chips" id="bodyChips" role="group" aria-label="Karosserie"></div>
    <div class="frow">
      <label for="maxPrice">Preis bis <input type="range" id="maxPrice" min="10000" max="40000" step="1000" value="40000"><output id="maxOut" class="num"></output></label>
      <label for="maxKm">km bis <input type="range" id="maxKm" min="20000" max="120000" step="10000" value="120000"><output id="kmOut" class="num"></output></label>
      <label for="gear">Getriebe <select id="gear"><option value="">alle</option><option>Automatik</option><option>Schaltung</option></select></label>
      <label for="sort">Reihenfolge <select id="sort"><option value="asc">günstigste zuerst</option><option value="desc">teuerste zuerst</option><option value="km">wenigste km</option><option value="year">neueste zuerst</option></select></label>
    </div>
  </div>

  <section class="detail" id="detail" aria-live="polite"></section>

  <footer class="foot">
    <span>Autohaus Muster · Musterstraße 1 · 08468 Reichenbach im Vogtland</span>
    <span>Mo–Fr 9–18 Uhr · Sa 9–13 Uhr</span>
    <span>Beispielseite mit Beispielfahrzeugen. Fotos: Wikimedia Commons, Autor und Lizenz jeweils am Bild.</span>
  </footer>
</div>

<script>
const HOURS={Mon:[540,1080],Tue:[540,1080],Wed:[540,1080],Thu:[540,1080],Fri:[540,1080],Sat:[540,780]};
const FUEL={Benzin:"--f-benzin",Diesel:"--f-diesel",Hybrid:"--f-hybrid",Elektro:"--f-elektro"};
// [Marke, Modell, Variante, Preis, alterPreis, EZ, km, PS, Kraftstoff, Getriebe, Karosserie, Halter, HU bis, Farbe, Highlights, Badge, MwSt, Commons-Suche]
const RAW=[
 ["VW","Golf 1.5 TSI","Life, 5-Türer",18990,0,"04/2021",48000,130,"Benzin","Schaltung","Kompakt",1,"04/2027","Moonstone Grau",["Navi","ACC","LED","Sitzheizung","Einparkhilfe"],"new",0,"Volkswagen Golf VIII"],
 ["Skoda","Octavia Combi 2.0 TDI","Style DSG",17490,18490,"09/2020",89000,150,"Diesel","Automatik","Kombi",1,"09/2026","Schwarz Magic",["Virtual Cockpit","LED Matrix","AHK","Sitzheizung","Kamera"],"deal",1,"Skoda Octavia IV Combi"],
 ["BMW","320d Touring","xDrive, Sport Line",21900,0,"06/2019",112000,190,"Diesel","Automatik","Kombi",2,"06/2027","Mineralgrau",["Allrad","Navi Professional","Head-up","Sportsitze","AHK"],"",0,"BMW 3 Series Touring G21"],
 ["Audi","A4 Avant 40 TDI","S tronic, advanced",23490,0,"02/2020",95000,204,"Diesel","Automatik","Kombi",1,"02/2027","Floretsilber",["Virtual Cockpit","Navi","LED","Tempomat","elektr. Heckklappe"],"",1,"Audi A4 Avant B9"],
 ["Mercedes-Benz","C 200 Limousine","Avantgarde",24900,0,"11/2019",74000,184,"Benzin","Automatik","Limousine",1,"11/2026","Obsidianschwarz",["Kamera","Navi","LED High Performance","Sitzheizung","Ambientebeleuchtung"],"",0,"Mercedes-Benz C-Class W205 sedan"],
 ["VW","Tiguan 2.0 TDI","4Motion, Highline",25990,26990,"07/2020",86000,150,"Diesel","Automatik","SUV",1,"07/2026","Atlantic Blue",["Allrad","AHK","Panoramadach","ACC","Kamera"],"deal",0,"Volkswagen Tiguan II"],
 ["Toyota","Yaris Hybrid","Team Deutschland",16490,0,"05/2021",39000,116,"Hybrid","Automatik","Kleinwagen",1,"05/2027","Tokyo Rot",["Kamera","Spurhalteassistent","Klimaautomatik","Apple CarPlay"],"",0,"Toyota Yaris XP210"],
 ["Opel","Corsa 1.2","Edition",11990,0,"03/2021",41000,75,"Benzin","Schaltung","Kleinwagen",1,"03/2027","Weiß",["Klima","Bluetooth","Tempomat","Spurhalteassistent"],"",0,"Opel Corsa F"],
 ["Ford","Focus Turnier 1.0 EcoBoost","Titanium",12990,0,"10/2019",78000,125,"Benzin","Schaltung","Kombi",2,"10/2026","Magnetic Grau",["Navi","Sitzheizung","Lenkradheizung","Einparkhilfe"],"",0,"Ford Focus IV Turnier"],
 ["Hyundai","Tucson 1.6 T-GDI Hybrid","Prime",27490,0,"08/2022",35000,230,"Hybrid","Automatik","SUV",1,"08/2028","Shadow Grey",["Navi","360°-Kamera","Sitzbelüftung","LED","Herstellergarantie bis 08/2027"],"new",1,"Hyundai Tucson NX4"],
 ["Tesla","Model 3 Long Range","Dual Motor AWD",26990,28490,"06/2021",68000,440,"Elektro","Automatik","Limousine",1,"06/2027","Pearl White",["Allrad","Autopilot","Glasdach","Wärmepumpe","Premium-Audio"],"deal",1,"Tesla Model 3"],
 ["VW","ID.3 Pro","58 kWh, Life",19990,0,"09/2021",52000,204,"Elektro","Automatik","Kompakt",1,"09/2027","Manganese Grey",["Navi","Wärmepumpe","ACC","Sitzheizung","Schnellladen 100 kW"],"",0,"Volkswagen ID.3"],
 ["Seat","Leon 1.5 eTSI","FR DSG",19490,0,"01/2021",44000,150,"Benzin","Automatik","Kompakt",1,"01/2027","Desire Rot",["Virtual Cockpit","LED","ACC","Sportfahrwerk","Kamera"],"",0,"SEAT Leon IV"],
 ["Skoda","Fabia 1.0 TSI","Style",14990,0,"05/2022",27000,95,"Benzin","Schaltung","Kleinwagen",1,"05/2028","Moon Weiß",["Klimaautomatik","LED","Sitzheizung","Einparkhilfe"],"new",0,"Skoda Fabia IV"],
 ["BMW","X3 xDrive20d","xLine",28900,0,"04/2019",98000,190,"Diesel","Automatik","SUV",2,"04/2027","Phytonicblau",["Allrad","Navi","AHK","Lederausstattung","elektr. Heckklappe"],"",1,"BMW X3 G01"],
 ["Renault","Clio TCe 90","Intens",10990,11990,"08/2020",58000,91,"Benzin","Schaltung","Kleinwagen",2,"08/2026","Orange Valencia",["Navi","Kamera","Klimaautomatik","LED"],"deal",0,"Renault Clio V"],
 ["Mercedes-Benz","GLC 300 de","4MATIC, AMG Line",36900,0,"03/2021",69000,306,"Hybrid","Automatik","SUV",1,"03/2027","Selenitgrau",["Plug-in-Hybrid","Allrad","AHK","Burmester","360°-Kamera"],"",1,"Mercedes-Benz GLC X253"],
 ["Dacia","Duster TCe 130","Prestige",16990,0,"06/2022",31000,131,"Benzin","Schaltung","SUV",1,"06/2028","Urban Grey",["Navi","Multiview-Kamera","Klima","Tempomat"],"",0,"Dacia Duster II"]
];
const CARS=RAW.map((r,i)=>({id:i,brand:r[0],model:r[1],variant:r[2],price:r[3],old:r[4],ez:r[5],km:r[6],ps:r[7],fuel:r[8],gear:r[9],body:r[10],owners:r[11],hu:r[12],color:r[13],
  tags:r[14],badge:r[15],vat:!!r[16],q:r[17],year:+r[5].slice(3)*100+(+r[5].slice(0,2)),photos:[]}));
const eur=n=>n.toLocaleString("de-DE")+" €";
const kmf=n=>n.toLocaleString("de-DE")+" km";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SIL={"Kompakt":"M10 74 L14 58 Q22 50 46 48 L74 30 Q84 26 150 27 L178 46 Q216 50 226 60 L230 74 Z","Kleinwagen":"M24 74 L28 58 Q34 50 54 48 L78 30 Q88 26 140 27 L166 46 Q206 50 214 60 L218 74 Z",
  "Kombi":"M8 74 L13 61 Q28 52 58 50 L84 35 Q94 30 186 32 L214 47 Q228 53 231 63 L234 74 Z","Limousine":"M8 74 L14 63 Q34 55 66 52 L96 36 Q114 30 160 32 L192 50 Q220 52 230 62 L234 74 Z",
  "SUV":"M10 76 L12 58 Q18 48 38 46 L68 28 Q78 23 152 24 L182 42 Q220 46 228 58 L232 76 Z"};
function sil(c){return `<svg viewBox="0 0 242 96" aria-hidden="true"><path d="${SIL[c.body]}" fill="none" stroke="var(--muted)" stroke-width="1.5"/><circle cx="64" cy="76" r="12" fill="none" stroke="var(--muted)" stroke-width="1.5"/><circle cx="186" cy="76" r="12" fill="none" stroke="var(--muted)" stroke-width="1.5"/></svg>`;}
function pic(c,src,alt,badge){const b=badge&&c.badge?`<span class="badge ${c.badge}">${c.badge==="deal"?"Preis gesenkt":"Neu eingetroffen"}</span>`:"";
  return `<div class="pic">${b}${sil(c)}${src?`<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()">`:""}</div>`;}

/* photos: example pictures live from Wikimedia Commons */
const BAD=/interior|innenraum|cockpit|dashboard|engine|motor|wheel|felge|badge|logo|emblem|detail|steering|seat |model car|lego|toy|spielzeug|render|crash|unfall|police|polizei|taxi/i;
const stripTags=h=>{const d=document.createElement("div");d.innerHTML=h||"";return d.textContent.trim().replace(/\s+/g," ");};
async function loadPhotos(c){
  const key="ah1:"+c.q;
  try{const cached=sessionStorage.getItem(key);if(cached){c.photos=JSON.parse(cached);return;}}catch(e){}
  const u="https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=20"
    +"&gsrsearch="+encodeURIComponent(c.q+" filetype:bitmap")+"&prop=imageinfo&iiprop=url|size|extmetadata&iiextmetadatafilter=Artist|LicenseShortName&iiurlwidth=1280";
  const j=await (await fetch(u)).json();
  const pages=Object.values((j.query&&j.query.pages)||{}).sort((a,b)=>a.index-b.index);
  const words=c.q.toLowerCase().split(" ").filter(w=>w.length>1);
  c.photos=pages.map(p=>{const ii=(p.imageinfo||[])[0];if(!ii||ii.width<900||ii.width<ii.height*1.15)return null;
      const t=p.title.toLowerCase().replace(/[_-]/g," ");const s=words.filter(w=>t.includes(w)).length*2-(BAD.test(p.title)?6:0)-p.index*.05;
      const m=ii.extmetadata||{};return{s,full:ii.thumburl||ii.url,thumb:(ii.thumburl||ii.url).replace(/\/1280px-/,"/480px-"),page:ii.descriptionurl,
        author:stripTags(m.Artist&&m.Artist.value)||"unbekannt",lic:(m.LicenseShortName&&m.LicenseShortName.value)||""};})
    .filter(Boolean).sort((a,b)=>b.s-a.s).slice(0,3);
  try{sessionStorage.setItem(key,JSON.stringify(c.photos));}catch(e){}
}
function applyPhotos(c){
  document.querySelectorAll(`.card[data-id="${c.id}"] .pic`).forEach(el=>{el.outerHTML=pic(c,c.photos[0]&&c.photos[0].full,c.brand+" "+c.model,true);});
  if(shownId===c.id){shownId=-1;showDetail(c);}
}
function loadAll(){CARS.forEach(c=>loadPhotos(c).then(()=>applyPhotos(c)).catch(()=>{}));}

/* opening hours */
(function(){const p=Object.fromEntries(new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Berlin",weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  const m=(+p.hour)*60+(+p.minute),h=HOURS[p.weekday],open=!!h&&m>=h[0]&&m<h[1];
  document.getElementById("dot").className="dot "+(open?"open":"closed");document.getElementById("statusText").textContent=open?"Jetzt geöffnet":"Geschlossen · Anfrage per WhatsApp jederzeit";})();

/* filters */
const state={fuel:"Alle",body:"Alle",max:40000,km:120000,gear:"",sort:"asc"};
function chips(el,list,key){el.innerHTML=list.map(v=>`<button type="button" class="chip" aria-pressed="${state[key]===v}" data-v="${esc(v)}">${esc(v)}</button>`).join("");
  el.onclick=e=>{const b=e.target.closest(".chip");if(!b)return;state[key]=b.dataset.v;chips(el,list,key);render();};}
chips(document.getElementById("fuelChips"),["Alle","Benzin","Diesel","Hybrid","Elektro"],"fuel");
chips(document.getElementById("bodyChips"),["Alle","Kleinwagen","Kompakt","Kombi","Limousine","SUV"],"body");
const maxEl=document.getElementById("maxPrice"),kmEl=document.getElementById("maxKm");
const paintOut=()=>{document.getElementById("maxOut").textContent=eur(state.max);document.getElementById("kmOut").textContent=kmf(state.km);};
maxEl.oninput=()=>{state.max=+maxEl.value;paintOut();render();};kmEl.oninput=()=>{state.km=+kmEl.value;paintOut();render();};paintOut();
document.getElementById("gear").onchange=e=>{state.gear=e.target.value;render();};
document.getElementById("sort").onchange=e=>{state.sort=e.target.value;render();};
const fBtn=document.getElementById("filterBtn"),fBox=document.getElementById("filters");
fBtn.onclick=()=>{fBox.hidden=!fBox.hidden;fBtn.setAttribute("aria-expanded",String(!fBox.hidden));};
const activeFilters=()=>(state.fuel!=="Alle")+(state.body!=="Alle")+(state.max<40000)+(state.km<120000)+(!!state.gear);
function filtered(){const l=CARS.filter(c=>(state.fuel==="Alle"||c.fuel===state.fuel)&&(state.body==="Alle"||c.body===state.body)&&c.price<=state.max&&c.km<=state.km&&(!state.gear||c.gear===state.gear));
  l.sort((a,b)=>state.sort==="asc"?a.price-b.price:state.sort==="desc"?b.price-a.price:state.sort==="km"?a.km-b.km:b.year-a.year);return l;}

/* reel: own physics loop with inertia, ticks and haptics */
const reel=document.getElementById("reel"),track=document.getElementById("track");
let COPIES=9,items=[],offset=0,spinning=false,shownId=-1,anim=null,lastIdx=-1;
const gap=12,cw=()=>track.firstElementChild?track.firstElementChild.offsetWidth:300,step=()=>cw()+gap;
const offFor=p=>reel.clientWidth/2-(p*step()+cw()/2);
const idxAt=o=>(reel.clientWidth/2-o-cw()/2)/step();
const reduceMotion=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
let actx=null,soundOn=true,lastTick=0;
try{soundOn=localStorage.getItem("reelSound")!=="off";}catch(e){}
function audio(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(actx&&actx.state==="suspended")actx.resume();return actx;}
function blip(freq,dur,vol,type,delay){const a=audio();if(!a)return;const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();
  o.type=type||"triangle";o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(freq*.6,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02);}
function buzz(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
function tick(){const now=performance.now();if(now-lastTick<28)return;lastTick=now;if(soundOn)blip(1700+Math.random()*250,.035,.07,"square");buzz(6);}
function winSound(){if(soundOn){blip(880,.18,.12,"triangle");blip(1320,.32,.1,"triangle",.09);}buzz([25,40,60]);}
const sBtn=document.getElementById("soundBtn");
function paintSound(){sBtn.setAttribute("aria-pressed",String(soundOn));sBtn.setAttribute("aria-label",soundOn?"Ton aus":"Ton an");sBtn.querySelector(".x").style.display=soundOn?"none":"";sBtn.querySelector(".w").style.display=soundOn?"":"none";}
sBtn.onclick=()=>{soundOn=!soundOn;try{localStorage.setItem("reelSound",soundOn?"on":"off");}catch(e){}paintSound();if(soundOn)tick();};
paintSound();
function reindex(){const n=track.children,i=Math.round(idxAt(offset));for(let k=0;k<n.length;k++)n[k].classList.toggle("is-center",k===i);lastIdx=i;}
function wrap(){if(!items.length)return;const L=items.length,i=idxAt(offset),shift=L*step();
  if(i<L*2)offset-=Math.ceil((L*2-i)/L)*shift;else if(i>L*(COPIES-2))offset+=Math.ceil((i-L*(COPIES-2))/L)*shift;
  track.style.transform=`translate3d(${offset}px,0,0)`;reindex();}
function paint(){track.style.transform=`translate3d(${offset}px,0,0)`;
  const i=Math.round(idxAt(offset));if(i!==lastIdx){const n=track.children;if(n[lastIdx])n[lastIdx].classList.remove("is-center");if(n[i])n[i].classList.add("is-center");if(lastIdx!==-1)tick();lastIdx=i;}}
function stopAnim(){if(anim){cancelAnimationFrame(anim.raf);anim=null;}}
const easeOutCubic=t=>1-Math.pow(1-t,3),easeOutQuint=t=>1-Math.pow(1-t,5);
function animateTo(to,ms,ease,done){stopAnim();if(reduceMotion())ms=Math.min(ms,120);
  const a={from:offset,to,ms:Math.max(1,ms),ease:ease||easeOutCubic,t0:performance.now(),done};anim=a;
  const f=now=>{if(anim!==a)return;const p=Math.min(1,(now-a.t0)/a.ms);offset=a.from+(a.to-a.from)*a.ease(p);paint();
    if(p<1)a.raf=requestAnimationFrame(f);else{anim=null;a.done&&a.done();}};a.raf=requestAnimationFrame(f);}
function settle(){wrap();paint();buzz(12);if(items.length)showDetail(items[((Math.round(idxAt(offset))%items.length)+items.length)%items.length]);}
function snapTo(i,ms){animateTo(offFor(i),ms||280,easeOutCubic,settle);}
function renderReel(){
  stopAnim();document.getElementById("empty").hidden=items.length>0;document.getElementById("spinBtn").disabled=!items.length;
  if(!items.length){track.innerHTML="";document.getElementById("detail").innerHTML="";shownId=-1;return;}
  COPIES=Math.max(9,Math.ceil(90/items.length)+4);
  let h="";for(let k=0;k<COPIES;k++)items.forEach((c,i)=>{h+=`<div class="card" style="--fc:var(${FUEL[c.fuel]})" data-i="${i}" data-id="${c.id}">${pic(c,c.photos[0]&&c.photos[0].full,c.brand+" "+c.model,true)}<div class="fuel"></div>
    <div class="card-body"><span class="model">${esc(c.brand)} ${esc(c.model)}</span><span class="variant">${esc(c.variant)}</span>
    <div class="line"><span class="price num">${eur(c.price)}</span><span class="meta num">${c.ez.slice(3)} · ${kmf(c.km)}<br>${c.fuel} · ${c.gear}</span></div></div></div>`;});
  track.innerHTML=h;offset=offFor(Math.floor(COPIES/2)*items.length);track.style.transform=`translate3d(${offset}px,0,0)`;reindex();settle();
}
reel.addEventListener("keydown",e=>{if(!items.length||spinning)return;const i=Math.round(idxAt(anim?anim.to:offset));
  if(e.key==="ArrowLeft"){audio();snapTo(i-1);e.preventDefault();}if(e.key==="ArrowRight"){audio();snapTo(i+1);e.preventDefault();}});
let drag=null;
reel.addEventListener("pointerdown",e=>{if(spinning||!items.length)return;audio();stopAnim();wrap();
  drag={x:e.clientX,o:offset,moved:0,id:e.pointerId,samples:[{t:performance.now(),x:e.clientX}]};});
window.addEventListener("pointermove",e=>{if(!drag||e.pointerId!==drag.id)return;const dx=e.clientX-drag.x;drag.moved=Math.max(drag.moved,Math.abs(dx));
  const now=performance.now();drag.samples.push({t:now,x:e.clientX});while(drag.samples.length>2&&now-drag.samples[0].t>100)drag.samples.shift();
  if(drag.moved>6){reel.classList.add("dragging");offset=drag.o+dx;paint();}});
function endDrag(e){if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;reel.classList.remove("dragging");
  if(d.moved<=6){const card=e.target.closest&&e.target.closest(".card");
    if(card&&reel.contains(card)){const idx=[...track.children].indexOf(card);if(idx===Math.round(idxAt(offset)))document.getElementById("detail").scrollIntoView({behavior:"smooth"});else snapTo(idx,380);}
    else snapTo(Math.round(idxAt(offset)));return;}
  const s=d.samples,a=s[0],b=s[s.length-1],now=performance.now();
  let v=(now-b.t>80)?0:(b.x-a.x)/Math.max(1,b.t-a.t);v=Math.max(-6,Math.min(6,v));
  const target=Math.round(idxAt(offset+v*420)),to=offFor(target),dist=Math.abs(to-offset);
  animateTo(to,Math.abs(v)>.15?Math.min(3200,Math.max(260,3*dist/Math.abs(v))):300,easeOutCubic,settle);}
window.addEventListener("pointerup",endDrag);window.addEventListener("pointercancel",endDrag);
window.addEventListener("resize",()=>{if(items.length){const i=Math.round(idxAt(offset));stopAnim();offset=offFor(i);paint();}});
document.getElementById("spinBtn").onclick=()=>{
  if(spinning||!items.length)return;audio();stopAnim();wrap();
  const L=items.length,cur=Math.round(idxAt(offset)),extra=Math.max(25,L*2)+Math.floor(Math.random()*L);
  offset+=Math.floor((cur-L)/L)*L*step();track.style.transform=`translate3d(${offset}px,0,0)`;reindex();
  const target=Math.round(idxAt(offset))+extra,jitter=(Math.random()-.5)*cw()*.7;
  spinning=true;document.getElementById("spinBtn").disabled=true;
  animateTo(offFor(target)+jitter,5200,easeOutQuint,()=>{animateTo(offFor(target),350,easeOutCubic,()=>{
    const el=track.children[target];el&&el.classList.add("win");winSound();settle();
    setTimeout(()=>{el&&el.classList.remove("win");spinning=false;document.getElementById("spinBtn").disabled=false;},900);});});
};

/* details of the centred car */
function credit(c,i){const p=c.photos[i];if(!p)return c.photos.length?"":"Foto wird geladen …";return `Beispielfoto: <a href="${esc(p.page)}" target="_blank" rel="noopener">${esc(p.author)}</a>${p.lic?" · "+esc(p.lic):""} · Wikimedia Commons`;}
function showDetail(c){
  if(c.id===shownId)return;shownId=c.id;const box=document.getElementById("detail");
  box.innerHTML=`<div class="d-top"><div><h1>${esc(c.brand)} ${esc(c.model)}</h1><div class="d-variant">${esc(c.variant)} · ${esc(c.color)}</div></div>
    <div class="d-price num">${c.old?`<s>${eur(c.old)}</s>`:""}<b>${eur(c.price)}</b><small>${c.vat?"MwSt. ausweisbar":"Differenzbesteuert"}</small></div></div>
  <div class="big" id="big">${pic(c,c.photos[0]&&c.photos[0].full,c.model,true)}</div>
  <div class="credit" id="credit">${credit(c,0)}</div>
  <div class="gallery"${c.photos.length>1?"":" hidden"}>${c.photos.map((p,i)=>`<button type="button" data-i="${i}" aria-current="${i===0}" aria-label="Foto ${i+1}">${pic(c,p.thumb,"")}</button>`).join("")}</div>
  <div class="facts num">
    <div><span>Erstzulassung</span><b>${c.ez}</b></div><div><span>Kilometer</span><b>${kmf(c.km)}</b></div><div><span>Leistung</span><b>${c.ps} PS</b></div>
    <div><span>Kraftstoff</span><b>${c.fuel}</b></div><div><span>Getriebe</span><b>${c.gear}</b></div><div><span>HU bis</span><b>${c.hu}</b></div></div>
  <div class="sec">Ausstattung</div><div class="tags">${c.tags.map(t=>`<span>${esc(t)}</span>`).join("")}</div>
  <div class="sec">Gut zu wissen</div><ul class="cond num">
    <li><span>Vorbesitzer</span><span>${c.owners}</span></li><li><span>Karosserie</span><span>${c.body}</span></li>
    <li><span>Garantie</span><span>12 Monate Gebrauchtwagengarantie</span></li><li><span>Finanzierung</span><span>möglich, Angebot auf Anfrage</span></li>
    <li><span>Inzahlungnahme</span><span>Ihr bisheriges Auto nehmen wir gern in Zahlung</span></li></ul>
  <div class="cta"><button class="btn main" type="button" data-m="ask">Per WhatsApp anfragen</button>
    <div class="two"><button class="btn alt" type="button" data-m="drive">Probefahrt vereinbaren</button><button class="btn alt" type="button" data-m="trade">Mein Auto in Zahlung geben</button></div>
    <div id="msgBox" hidden><div class="msg" id="msgText"></div><p class="small">Im echten Einsatz öffnet dieser Button direkt WhatsApp beim Autohaus, mit diesem Text.</p></div></div>`;
  box.querySelector(".gallery").onclick=e=>{const b=e.target.closest("button");if(!b)return;const i=+b.dataset.i;box.querySelector("#big").innerHTML=pic(c,c.photos[i].full,c.model,true);box.querySelector("#credit").innerHTML=credit(c,i);box.querySelectorAll(".gallery button").forEach((x,j)=>x.setAttribute("aria-current",String(j===i)));};
  const car=`${c.brand} ${c.model} ${c.variant} (${eur(c.price)}, ${kmf(c.km)}, EZ ${c.ez})`;
  const T={ask:`Hallo,\nich interessiere mich für den ${car}.\nIst das Fahrzeug noch verfügbar?`,
    drive:`Hallo,\nich möchte den ${car} gern Probe fahren.\nPasst es Ihnen am ______ um ____ Uhr?`,
    trade:`Hallo,\nich interessiere mich für den ${car} und möchte mein Auto in Zahlung geben:\nMarke/Modell: ______, Baujahr: ____, km: ______`};
  box.querySelector(".cta").onclick=e=>{const b=e.target.closest("[data-m]");if(!b)return;box.querySelector("#msgText").textContent=T[b.dataset.m];box.querySelector("#msgBox").hidden=false;};
}

function render(){items=filtered();const n=activeFilters();document.getElementById("filterN").textContent=n?`(${n})`:"";
  document.getElementById("count").textContent=items.length?`${items.length} Fahrzeuge`:"";shownId=-1;renderReel();}
render();
loadAll();
</script>
</body>
